server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/xml text/plain image/svg+xml font/woff2;

  # Archivos con hash de Astro: no cambian nunca, caché de un año
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~* \.(webp|png|pdf|woff2)$ {
    add_header Cache-Control "public, max-age=604800";
  }
  location / {
    try_files $uri $uri/ =404;
  }
}
